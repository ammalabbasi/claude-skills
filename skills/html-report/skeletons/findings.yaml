# FINDINGS — answers one question: "What did this one experiment show?"
# Send it when a single result needs more than a line in a status table; link it from that row.
type: findings
title: REPLACE findings                  # browser tab, 2-6 words
question: REPLACE — the question, as you'd ask it (this is the page heading)
project: REPLACE
date: REPLACE                            # YYYY-MM-DD
context: Answers REPLACE (their IDs) · commit `REPLACE`
answer: REPLACE — one or two sentences, with direction and size.

tested:                                  # one row per test
  - {test: REPLACE, data: "REPLACE — simulated / public reference / real, pooled", n: REPLACE}

found:                                   # one entry per result, in the order of `tested`
  - heading: REPLACE — the result as a statement
    text: REPLACE — one sentence on what the numbers show.
    table:                               # optional; or bars: / figure: {png, alt, caption}
      columns: [REPLACE, REPLACE]
      num: [1]
      rows: [[REPLACE, REPLACE]]

limits: [REPLACE — what this does not show]
next: [REPLACE — the decision or follow-up it enables]
# reproduce: |                           # optional; folded at the bottom. Strip before sharing outside.
#   REPLACE commands
