# UPDATE — answers: "What's going on across my projects, and what do you need from me?"
# The periodic email. One tab per area; with a single area there are no tabs.
type: update
title: REPLACE update                    # browser tab, 2-6 words
heading: Update — REPLACE (date in words)
project: REPLACE
date: REPLACE                            # YYYY-MM-DD
context: One tab per area; decisions are at the foot of each.
summary: >-
  REPLACE — "In one paragraph": what's done, what moved the results, and what you need from them.

areas:
  - label: REPLACE                       # short tab label
    heading: REPLACE — the area's headline
    summary: REPLACE — one line on what this tab is about.
    blocks:                              # a few bullets, or one table; tiles/bars/figure if they help
      - list: [REPLACE]
    asks:                                # optional; shown at the foot of this tab
      - {ask: REPLACE — the decision., detail: REPLACE — cost, time, or what happens if not.}
