# STATUS — answers one question: "Did you do what I asked?"
# Send it after each round of fixes, back to the person who gave you the list.
# One table per document they sent, in their numbering. Count boxes are computed; never type them.
type: status
title: REPLACE review status             # browser tab, 2-6 words
heading: REPLACE — status of your review
project: REPLACE
date: REPLACE                            # YYYY-MM-DD
context: Your REPLACE review · commit `REPLACE`
# previous: YYYY-MM-DD_status.yaml       # last round's file: changed rows get a ●
bottom_line: REPLACE — one or two sentences they need if they read nothing else.

sources:                                 # one entry per document they sent
  - name: Your REPLACE (date) review (REPLACE ID range)
    items:
      - id: REPLACE                      # their ID, unchanged
        asked: REPLACE — their ask, in a line.
        done: REPLACE — what you did and how you checked it.
        status: fixed                    # fixed | progress | open | wontdo
        commit: REPLACE                  # optional
