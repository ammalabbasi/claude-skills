      - {id: P0-4, asked: "Unbinned contigs shown as a genome; missing completeness shown as 0%.", done: "Shown as community-level evidence; NA stays NA.", status: fixed, commit: e91d7c2}
      - {id: P0-5, asked: "Cohort report not gated on every output it shows.", done: "Gated on every lane, and reads only declared inputs; a stale results folder cannot change the report.", status: fixed, commit: 6b5f0a8}
      - {id: P1-1, asked: "A plotting step lacked its stage label.", done: "Label added.", status: fixed, commit: 3d8e2c7}
      - {id: P1-2, asked: "Protein-search rescue ignored the configured filters.", done: "Filters passed to both consumers.", status: fixed, commit: 3d8e2c7}
