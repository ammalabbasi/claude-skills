      - {id: A8, asked: "Remove scratch-file I/O in recruitment.", done: "Streams directly now; outputs byte-identical (tested).", status: fixed, commit: 8c7e1a4}
      - {id: A9, asked: "Clarify the coverage track.", done: "Bin size explicit and in the file name; documented.", status: fixed, commit: 8c7e1a4}
      - {id: V1, asked: "Recompute tiers on the corrected island length.", done: "0 tier changes.", status: fixed}
      - {id: V2, asked: "Fragment-collapsed counts as a sensitivity check.", done: "Tiers stay on raw reads; every sample also reports collapsed counts and a stability flag.", status: fixed, commit: 9e4f2b6}
      - {id: V3/V4, asked: "Technical-bias package: aligner and provenance.", done: "Aligner sweep and control done; provenance is E2/E3.", status: fixed}
