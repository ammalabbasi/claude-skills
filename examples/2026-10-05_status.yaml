demo: >-
  Real report from 5 Oct 2026, cleaned for sharing: names, paths and sample identifiers removed; cohort
  numbers and commit hashes replaced with placeholders; unpublished findings described only in general terms.
bottom_line: >-
  The full validation you asked for before freezing the corrected extraction rule is clean, and the rule is in the
  release candidate. On every tumour in the cohort it moves some samples up exactly one tier and none down; matched
  normals do not change. The WES and RNA sets were rerun rather than relabelled, which reverses the 29 Sep plan.
  The full WGS rerun is next.

sources:
  - name: Your 1 Oct reply (L1–L10)
    items:
      - {id: L1, asked: "Full cohort, tumours and matched normals: tier transitions and changes in reads, genes and island breadth.", done: "600 / 600 runs done. Tumours: 52 up exactly one tier, 0 down. Normals: unchanged in 300 / 300. Old tiers recompute identically.", status: fixed}
      - {id: L2, asked: "Repeat the validation for WES.", done: "900 / 900 rerun. Tumour reads on target genes up by about 80%; no sample loses reads. Normal gains are much smaller; a blood-vs-tissue split is the follow-up.", status: fixed}
      - {id: L3, asked: "Make the rescue aligner-aware.", done: "On only when the input header shows the affected aligner; otherwise off and byte-identical to the old rule.", status: fixed, commit: 7b2e0d4}
      - {id: L4, asked: "QC: aligner settings per sample, and how many rescued reads survive each stage.", done: "Per-sample header table and per-stage counts, checked to only decrease; summarised in the run report.", status: fixed, commit: 5d81c3a}
      - {id: L5, asked: "Regression tests, including the score boundary.", done: "Tests on both sides of the cut-off, on both mates and an unpaired read; the boundary follows the setting.", status: fixed, commit: 9e4f2b6}
      - {id: L6, asked: "FASTQ vs corrected BAM on the same sample.", done: "2 samples: the corrected BAM recovers as many target reads as the FASTQ route; the old rule recovers under half.", status: fixed}
      - {id: L7, asked: "Recheck tier calibration on the corrected data.", done: "Thresholds hold; no recalibration. To repeat on the full WGS rerun.", status: fixed}
      - {id: L8, asked: "Validate the companion profiler on a broad panel before assuming the same impact.", done: "Deferred: no work on that pipeline right now. Not assumed in the meantime.", status: open}
      - {id: L9, asked: "Keep this as a paper validation figure.", done: "Material ready (aligner sweep, control, per-gene loss, L1/L2); figure not yet drafted.", status: progress}
      - {id: L10, asked: "Did earlier papers account for this aligner setting?", done: "None of the methods we could check do; written up separately.", status: fixed}

