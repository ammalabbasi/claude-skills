type: findings
title: Pairing fix findings
heading: Does the read-pairing fix change results on the pilot?
project: readsieve
date: 2026-09-14
meta: answers S1 and R3 · code at `e5f6a7b`
demo: "Example report. The project (readsieve), the reviewer and every number are invented."
tiles:
  - {n: 3 / 40, label: samples up one tier, kind: ok}
  - {n: 0, label: samples down a tier, kind: bad}
  - {n: "+4.1%", label: median reads kept per sample, kind: info}
summary:
  headline: The fix recovers mates in every sample and moves 3 of 40 up one tier, none down.
  body: The gain is largest for short-insert libraries, as the mechanism predicts. The thresholds hold; no rerun of later steps is needed beyond the 3 samples that changed tier.
blocks:
  - h2: What was tested
  - table:
      columns: [Test, Data, Scope, Question it answers]
      num: [2]
      rows:
        - ["**1. Synthetic**", simulated pairs with chunk boundaries every 1,000 reads, "10,000 pairs", "Are split mates rejoined?"]
        - ["**2. Pilot rerun**", the 40-sample pilot, pooled, "40", "Does the fix change tiers?"]
  - h2: Results
  - h3: 1. Synthetic pairs
  - p: "All 10,000 pairs rejoined (before the fix: 9,012). No pair joined to the wrong mate."
  - h3: 2. Reads kept, by library insert size
  - bars:
      caption: "Median increase in reads kept per sample after the fix, by insert-size bin (n = 40). Short inserts gain most."
      unit: "%"
      data:
        - {label: "< 200 bp (n = 9)", value: 9.8, kind: ok}
        - {label: "200–350 bp (n = 22)", value: 3.6, kind: ok}
        - {label: "> 350 bp (n = 9)", value: 0.7, kind: info}
  - table:
      columns: [Tier before, Tier after, Samples]
      num: [2]
      rows: [["low", "low", "21"], ["low", "medium", "2"], ["medium", "medium", "11"], ["medium", "high", "1"], ["high", "high", "5"]]
      caption: Tier transitions, 40 samples. No sample moved down.
  - h2: Sanity checks
  - list:
      - "Old tiers recompute identically from the stored counts: 40 / 40."
      - "Read totals before extraction are unchanged: 40 / 40."
  - h2: Caveats and what follows
  - list:
      - "**Caveat:** the pilot has few long-insert libraries (9); the effect there is small but less certain."
      - "**Next:** freeze the fix (done in v1.1.0) and rerun the 3 changed samples downstream."
methods: {code: "readsieve run --input pilot40.tsv --out runs/pairing_fix/\npython compare_tiers.py runs/v1.0.0 runs/pairing_fix > tiers.tsv"}
