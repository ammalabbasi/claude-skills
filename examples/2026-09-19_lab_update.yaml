type: update
title: Weekly lab update
heading: Update — 19 September 2026
project: Example project and lab infrastructure
date: 2026-09-19
meta: One tab per area; each is self-contained, and the decisions I need are at the foot of each.
demo: "Example report. The project, the reviewer and every number are invented."
summary: >-
  Example project v1.1.0 is released and validated. The cloud read-extraction method costs $0.63 per sample, 12× less than
  moving whole files. Two decisions are waiting on you: the full-cohort spend (tab 2) and the default read length (tab 1).
blocks:
  - tabs:
      - label: Example project release
        heading: "Example project v1.1.0: released, one result change"
        summary: All review findings are closed; the pairing fix moves 3 of 40 pilot samples up one tier.
        blocks:
          - tiles:
              - {n: "8 / 9", label: review findings closed, kind: ok}
              - {n: "3 / 40", label: pilot samples up a tier, kind: info}
          - h3: What changed
          - list:
              - "**Pairing:** split mates are rejoined."
              - "**Provenance:** the reference checksum is checked on every run."
        asks:
          - {ask: "Default minimum read length: 50 or 70 bp?", detail: "I recommend 70."}
      - label: Cloud costs
        heading: "Read extraction: what the full cohort would cost"
        summary: Extracting in the cloud and shipping only what we need is the cheapest of three options.
        blocks:
          - table:
              columns: [Approach, Pilot (95), Full cohort (1,100)]
              num: [1, 2]
              rows:
                - ["**A** — move whole files, extract here", "$790", "$9,150"]
                - ["**B** — extract in-region, ship only what we need", "**$60**", "**$695**"]
                - ["**C** — run everything in the cloud", "$210", "$2,430"]
          - note: Traffic inside the region is free; only data leaving it is billed.
            headline: "Why B is cheap."
          - p: "*Costs at list price; volumes and timings measured on the pilot.*"
        asks:
          - {ask: "Approve about $700 for the full cohort.", detail: "One afternoon of transfer."}
      - label: Infrastructure
        heading: "Cluster: new scratch quota and a job-template fix"
        blocks:
          - list:
              - "Scratch quota raised to 20 TB; old run directories archived (4.1 TB freed)."
              - "Job template now pins the environment, so tools no longer depend on the login shell."
      - label: Next week
        heading: Next week
        blocks:
          - list:
              - Thread-scaling benchmark on the 64-core node.
              - Full-cohort extraction, if approved.
